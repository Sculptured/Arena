[workspace]
resolver = "2"
members = ["kits/rust", "integrations/postgres", "integrations/folder", "integrations/service", "integrations/mariadb", "integrations/erpnext", "integrations/twenty-crm", "integrations/sculptured", "benchmarks/retail", "benchmarks/factory", "benchmarks/pharma"]
exclude = ["core"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
sha2 = "0.11"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
flate2 = "1"

[workspace.lints.clippy]
too_many_lines = "warn"
