<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Arena</title>
  <desc id="desc">Arena: test agent systems in a simulated copy of their world. Two agent setups, each run five times on the same scenario, their runs as rows of squares.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f6"/>
      <stop offset="1" stop-color="#eef2f0"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .title { font-size: 104px; font-weight: 700; letter-spacing: -2px; fill: #1d2a33; }
      .tag { font-size: 29px; font-weight: 400; fill: #4f5f66; }
      .chip { font-size: 16px; font-weight: 500; fill: #244f53; }
      .lbl { font-size: 14px; font-weight: 500; fill: #4f5f66; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="24" fill="url(#bg)" stroke="#dde3e1"/>
  <text x="66" y="150" class="title">Arena</text>
  <text x="72" y="208" class="tag">Test agent systems in a simulated copy of their world</text>
  <rect x="72" y="252" width="231" height="36" rx="18" fill="#e3ecea" stroke="#d3dfdc"/><text x="187.5" y="276" text-anchor="middle" class="chip">Real systems, simulated</text><rect x="315" y="252" width="214" height="36" rx="18" fill="#e3ecea" stroke="#d3dfdc"/><text x="422.0" y="276" text-anchor="middle" class="chip">Hard limits, enforced</text><rect x="541" y="252" width="231" height="36" rx="18" fill="#e3ecea" stroke="#d3dfdc"/><text x="656.5" y="276" text-anchor="middle" class="chip">Every setup run N times</text><rect x="784" y="252" width="137" height="36" rx="18" fill="#e3ecea" stroke="#d3dfdc"/><text x="852.5" y="276" text-anchor="middle" class="chip">Side by side</text>
  <text x="910" y="123" text-anchor="end" class="lbl">Setup A</text>
  <rect x="926" y="96" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="983.5" y="97.5" width="41" height="41" rx="6" fill="#f6e3e1" stroke="#b3261e" stroke-width="3"/><path d="M997 111 L1011 125 M1011 111 L997 125" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
  <rect x="1038" y="96" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="1094" y="96" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="1151.5" y="97.5" width="41" height="41" rx="6" fill="#f6e3e1" stroke="#b3261e" stroke-width="3"/><path d="M1165 111 L1179 125 M1179 111 L1165 125" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
  <text x="910" y="187" text-anchor="end" class="lbl">Setup B</text>
  <rect x="926" y="160" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="982" y="160" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="1038" y="160" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="1094" y="160" width="44" height="44" rx="7" fill="#2f6f73"/>
  <rect x="1150" y="160" width="44" height="44" rx="7" fill="#2f6f73"/>
</svg>
