# Python code health for every package in the repo (kits/python, integrations/*, sdk/python).
# Limits mirror the Rust and TypeScript rules: short, low-complexity functions.
line-length = 100
extend-exclude = ["core", "ui", "**/node_modules", "**/.venv"]

[lint]
select = ["C901", "PLR0912", "PLR0915"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 30
max-branches = 10
