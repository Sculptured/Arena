[project]
name = "arena-part"
version = "0.1.0"
description = "Kit for writing arena-part/1 integrations in Python"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena_part"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples"]
markers = ["live: needs services or hardware not always present"]
