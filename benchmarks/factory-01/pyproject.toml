[project]
name = "factory-01"
version = "0.2.0"
description = "arena-part/1 benchmark: Factory-01, a supplier delay and a purchase limit (scored by named checks)"
requires-python = ">=3.10"
dependencies = ["arena-part"]

[tool.uv]
package = false

[tool.uv.sources]
arena-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs services or hardware not always present"]
