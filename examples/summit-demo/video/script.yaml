# Summit video narration: disrupt, run, fail, rewind, change, compare, batch.
# Scripted agents (no AI models); every frame says so. `text` is the caption; `say`, when given, is
# what the voice reads. One sentence per on-screen beat: record.mjs times each spotlight to the
# start of its sentence (timings.json `sentences`), so keep sentence counts in step with record.mjs.
voice: af_heart
scenes:
  - id: intro
    text: "Every pharma supply chain has its list of bad days. A courier runs out of cold-chain capacity, a lot fails its retest, an urgent order lands at the worst moment. Before AI agents handle days like these, you need to know how they behave, not once, but every time. This is Arena, rehearsing a real incident in a digital twin of a biologics plant. The agents in this demo are scripted, so treat every number as an illustration."
  - id: world
    text: "This is the digital twin of Larchmont Biologics, where batch CVX-2611 is on hold after an environmental monitoring excursion. The QC lab holds every lot's test results. The warehouse shows each lot with its quantity, status and expiry. Carriers are the qualified cold-chain lanes, with how many shipments each has left this week. These eight customer orders were waiting on that batch, and every one is now at risk. On the right, every change an agent proposes waits for a person's decision. Across the top are the figures that matter: orders at risk, orders covered, safety violations and transport cost. It is all live state, drawn from a real ERP, CRM and approvals system, not a dashboard."
    say: "This is the digital twin of Larchmont Biologics, where batch C V X twenty-six eleven is on hold, after an environmental monitoring excursion. The Q C lab holds every lot's test results. The warehouse shows each lot, with its quantity, status, and expiry. Carriers are the qualified cold-chain lanes, with how many shipments each has left this week. These eight customer orders were waiting on that batch, and every one is now at risk. On the right, every change an agent proposes waits for a person's decision. Across the top are the figures that matter: orders at risk, orders covered, safety violations, and transport cost. It is all live state, drawn from a real E R P, C R M, and approvals system, not a dashboard."
  - id: disrupt
    text: "Now we stage the incident. Any team's agents can connect to Arena, here through an external system that drives them. In the scenario builder, I schedule a disruption inside the simulated carrier: the usual courier loses its capacity after the first quote. The preview says it in plain words, and ends with the part that matters. The agents are not told. They find out the way they would in production, when the world changes under them."
  - id: run
    text: "Team v1 takes the incident, and Arena records every step it takes. The twin replays the run: open the deviation, hold the batch, release the next one, and reallocate stock. Each tile that changes is outlined, with what changed written underneath. Under the controls, every step is a tick on the track, and the marks above it are the moments that matter."
    say: "Team v one takes the incident, and Arena records every step it takes. The twin replays the run: open the deviation, hold the batch, release the next one, and reallocate stock. Each tile that changes is outlined, with what changed written underneath. Under the controls, every step is a tick on the track, and the marks above it are the moments that matter."
  - id: fail
    text: "Here is the first one. The logistics agent tried to book a shipment before its change was approved. Arena refused it at the boundary, and the red triangle marks the moment. Once approved, it ships lot CVX-2589 to St Brennan's, with less shelf life than the order allows. The twin flags the order, and safety violations turns red. That is not a missed goal; it is a violation, counted on its own. Then the disruption we scheduled fires: the courier is out of capacity, and the next order has to move to another qualified lane."
    say: "Here is the first one. The logistics agent tried to book a shipment before its change was approved. Arena refused it at the boundary, and the red triangle marks the moment. Once approved, it ships lot C V X twenty-five eighty-nine to Saint Brennan's, with less shelf life than the order allows. The twin flags the order, and safety violations turns red. That is not a missed goal; it is a violation, counted on its own. Then the disruption we scheduled fires: the courier is out of capacity, and the next order has to move to another qualified lane."
  - id: rewind
    text: "In production, this is where someone starts writing an incident report. Here, you rewind. I step back to the quote just before the refused booking. Rewind here forks the whole world at exactly that state: the ERP, the CRM, the lab, the carriers and the approvals. Swap architecture is already chosen, with Team v2. Version two has two new rules: book only after approval, and check shelf life before allocating a lot. Change and rerun from here."
    say: "In production, this is where someone starts writing an incident report. Here, you rewind. I step back to the quote, just before the refused booking. Rewind here forks the whole world at exactly that state: the E R P, the C R M, the lab, the carriers, and the approvals. Swap architecture is already chosen, with Team v two. Version two has two new rules: book only after approval, and check shelf life before allocating a lot. Change, and rerun from here."
  - id: rerun
    text: "Same world, same step, same disruption, and a different architecture. Everything before the fork is reused, so only the decisions after it are new. This time the agent proposes the shipment, waits for approval, and books lot CVX-2604, which has the shelf life St Brennan's needs. The courier still runs out, and the team still moves to the next qualified lane. Orders move from at risk to covered, and safety violations stay at zero."
    say: "Same world, same step, same disruption, and a different architecture. Everything before the fork is reused, so only the decisions after it are new. This time the agent proposes the shipment, waits for approval, and books lot C V X twenty-six oh four, which has the shelf life Saint Brennan's needs. The courier still runs out, and the team still moves to the next qualified lane. Orders move from at risk to covered, and safety violations stay at zero."
  - id: compare
    text: "Now compare the two branches, by outcomes, not transcripts. Valid plan: eight of nine goal checks against nine of nine. One safety violation against none. Orders on time, transport cost, agent cost and escalations sit side by side. And the strip below shows exactly where the runs diverged, at the fork, and where each one met the disruption."
  - id: batch
    text: "One rerun is still an anecdote. So Arena runs a batch: thirty seeded incidents for each architecture, five incident types under three disruptions, twice each. Team v1 passes half of them, with a safety violation in half its runs. Team v2 passes all thirty, with none. These are rates you can hold a change to, before it ever reaches a real order."
    say: "One rerun is still an anecdote. So Arena runs a batch: thirty seeded incidents for each architecture, five incident types, under three disruptions, twice each. Team v one passes half of them, with a safety violation in half its runs. Team v two passes all thirty, with none. These are rates you can hold a change to, before it ever reaches a real order."
  - id: outro
    text: "Your agents, built on any framework, connect to Arena and meet the production world: real systems, and disruptions they are not told about. Arena refuses what is not allowed, and shows the consequence in the twin. You rewind to the exact moment, try another design, and turn the result into rates. Then you deploy what you have tested. These agents were scripted for today. Yours will not be."
