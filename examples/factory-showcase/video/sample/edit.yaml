# End-to-end sample: made-up data, every frame stamped. @S@ is the sample work folder (sample/run.sh fills it in).
title: SAMPLE - NOT RESULTS
output: @S@/sample.mp4
narration: @S@/narration/timings.json
watermark: "SAMPLE — NOT RESULTS"
music: null   # no free-licence track is bundled; set a file path to add quiet background music
scenes:
  - {id: cover, type: title, title: "Factory showcase", subtitle: "Video toolkit sample", duration: 2.0, chapter: Cover}
  - id: intro
    type: title
    title: "Sample of the toolkit"
    subtitle: "Narration, captions, lower-thirds, charts"
    chapter: Introduction
    lower_third: {title: "Piper TTS and ffmpeg", subtitle: "Open source, offline"}
  - {id: clip, type: clip, src: @S@/footage.mp4, chapter: "Sped-up footage", lower_third: {title: "Press line A", subtitle: "Generated placeholder footage", at: 1.2}}
  - {id: charts, type: clip, src: @S@/charts/context.mp4, chapter: Charts}
  - {id: outro, type: image, src: @S@/charts/checks.png, margin: 60, motion: zoom_in, chapter: Outro}
