[project]
name = "ot-network"
version = "0.1.0"
description = "arena-part/1 integration: a simulated plant OT network (zones, conduits, the IT/OT gateway and its remote sessions)"
requires-python = ">=3.10"
dependencies = ["arena-part"]

[tool.uv]
package = false

[tool.uv.sources]
arena-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs services or hardware not always present"]
