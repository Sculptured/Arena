[project]
name = "utility"
version = "0.1.0"
description = "arena-part/1 integration: a simulated electric utility (tariff, the site meter fed from the plant's load, demand-response events)"
requires-python = ">=3.10"
dependencies = ["arena-part"]

[tool.uv]
package = false

[tool.uv.sources]
arena-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs services or hardware not always present"]
